name: Costruisci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Codice
        uses: actions/checkout@v4

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prove
        run: dotnet test Liquidino.sln -c Release --nologo

      - name: Installer
        shell: pwsh
        run: ./scripts/pacchetto.ps1

      - name: Artefatto
        uses: actions/upload-artifact@v4
        with:
          name: Liquidino-Setup
          path: |
            Releases/Liquidino-Setup.exe
            Releases/*.nupkg
            Releases/releases.win.json
          if-no-files-found: error

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          [xml]$p = Get-Content Directory.Build.props
          $v = $p.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $testo = ./scripts/note-rilascio.ps1 -Changelog (Get-Content CHANGELOG.md -Raw) -Versione "$v"
          $fileNote = Join-Path $env:RUNNER_TEMP 'liquidino-note.md'
          [IO.File]::WriteAllText($fileNote, $testo.Trim() + "`n")
          ./scripts/pubblica-release.ps1 -Versione "$v" -Note $fileNote -Cartella (Resolve-Path Releases)
