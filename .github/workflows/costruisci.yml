name: Costruisci

on:
  push:
  pull_request:

# Un nuovo commit chiude il run precedente dello stesso ramo, così una prova
# appesa non tiene occupato il runner fino al tetto delle sei ore.
concurrency:
  group: costruisci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Codice
        uses: actions/checkout@v4

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prove
        run: dotnet test Liquidino.sln -c Release --nologo

      - name: Prova con llama-server
        timeout-minutes: 8
        shell: pwsh
        run: ./scripts/prova-motore.ps1

      - name: Installer
        shell: pwsh
        run: ./scripts/pacchetto.ps1

      - name: Prova di avvio dell'app pubblicata
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/prova-avvio.ps1

      - name: Artefatto
        uses: actions/upload-artifact@v4
        with:
          name: Liquidino
          path: |
            Releases/Liquidino-Setup.exe
            Releases/Liquidino-portatile.zip
            Releases/*.nupkg
            Releases/releases.win.json
            Releases/SHA256SUMS.txt
          if-no-files-found: error

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          [xml]$p = Get-Content Directory.Build.props
          $v = $p.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $testo = ./scripts/note-rilascio.ps1 -Changelog (Get-Content CHANGELOG.md -Raw) -Versione "$v"
          $fileNote = Join-Path $env:RUNNER_TEMP 'liquidino-note.md'
          [IO.File]::WriteAllText($fileNote, $testo.Trim() + "`n")
          ./scripts/pubblica-release.ps1 -Versione "$v" -Note $fileNote -Cartella (Resolve-Path Releases)
